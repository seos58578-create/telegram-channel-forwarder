name: Telegram Channel Forwarder

on:
  workflow_dispatch:
  schedule:
    # 北京时间：
    # 12:00 = UTC 04:00
    # 16:00 = UTC 08:00
    # 18:00 = UTC 10:00
    # 19:00 = UTC 11:00
    # 20:00 = UTC 12:00
    - cron: "0 4,8,10,11,12 * * *"

    # 北京时间：
    # 21:00 = UTC 13:00
    # 21:36 = UTC 13:36
    # 21:37 = UTC 13:37
    - cron: "0,36,37 13 * * *"

permissions:
  contents: write

concurrency:
  group: telegram-channel-forwarder
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-chi-sim \
            tesseract-ocr-vie \
            tesseract-ocr-por

      - name: Install CJK Fonts
        run: |
          sudo apt-get install -y \
            fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt

      - name: Run Telegram Forwarder
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SOURCE_CHANNELS: ${{ secrets.SOURCE_CHANNELS }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          SCAN_LIMIT: ${{ secrets.SCAN_LIMIT }}
        run: |
          python main.py

      - name: Commit processed.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add processed.json

          if git diff --cached --quiet; then
            echo "No changes to processed.json"
          else
            git commit -m "Update processed messages"
            git push
          fi
