name: Telegram Channel Forwarder

on:

  # GitHub Actions 页面手动运行
  workflow_dispatch:

  # 每 60 分钟运行一次
  schedule:
    - cron: "7,22,37,52 * * * *"


# 允许 Actions 提交 processed.json
permissions:
  contents: write


# 防止多个运行同时修改 processed.json
concurrency:
  group: telegram-channel-forwarder
  cancel-in-progress: false


jobs:

  forward:

    runs-on: ubuntu-latest


    steps:

      # =====================================================
      # 1. 拉取代码
      # =====================================================

      - name: Checkout repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # =====================================================
      # 2. Python
      # =====================================================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      # =====================================================
      # 3. 安装 Tesseract OCR
      # =====================================================

      - name: Install Tesseract OCR

        run: |

          sudo apt-get update

          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-chi-sim \
            tesseract-ocr-vie \
            tesseract-ocr-por


      # =====================================================
      # 4. 安装 Python 依赖
      # =====================================================

      - name: Install Python dependencies

        run: |

          python -m pip install --upgrade pip

          python -m pip install -r requirements.txt


      # =====================================================
      # 5. 运行 Telegram 转发程序
      # =====================================================

      - name: Run Telegram Forwarder

        env:

          API_ID: ${{ secrets.API_ID }}

          API_HASH: ${{ secrets.API_HASH }}

          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}

          SOURCE_CHANNELS: ${{ secrets.SOURCE_CHANNELS }}

          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}

          # 每个源频道最多读取最近 100 条
          SCAN_LIMIT: "100"

        run: |

          python main.py


      # =====================================================
      # 6. 保存 processed.json
      # =====================================================

      - name: Commit processed.json

        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add processed.json

          if git diff --cached --quiet; then

            echo "No changes to processed.json"

          else

            git commit -m "Update processed messages"

            git push

          fi
