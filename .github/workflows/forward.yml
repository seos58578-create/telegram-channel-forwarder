```yaml
name: Telegram Channel Forwarder

on:
  workflow_dispatch:
  schedule:
    # 北京时间：
    # 11:47 = UTC 03:47
    # 15:47 = UTC 07:47
    # 17:47 = UTC 09:47
    # 18:47 = UTC 10:47
    # 19:47 = UTC 11:47
    - cron: "47 3,7,9,10,11 * * *"

    # 北京时间：
    # 20:47 = UTC 12:47
    # 21:23 = UTC 13:23
    # 21:24 = UTC 13:24
    - cron: "47,23,24 12 * * *"
    - cron: "23,24 13 * * *"

permissions:
  contents: write

concurrency:
  group: telegram-channel-forwarder
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-chi-sim \
            tesseract-ocr-vie \
            tesseract-ocr-por

      - name: Install CJK Fonts
        run: |
          sudo apt-get install -y \
            fonts-noto-cjk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Telegram Forwarder
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SOURCE_CHANNELS: ${{ secrets.SOURCE_CHANNELS }}
          TARGET_CHANNEL: ${{ secrets.TARGET_CHANNEL }}
          SCAN_LIMIT: ${{ secrets.SCAN_LIMIT }}
        run: |
          python main.py

      - name: Commit processed.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add processed.json

          if git diff --cached --quiet; then
            echo "No changes to processed.json"
          else
            git commit -m "Update processed messages"
            git push
          fi
```
